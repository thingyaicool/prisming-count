name: Build Prism (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the SDK that targets GD 2.2081. Keep this in sync with "geode" in mod.json.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: v5.11.2

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
