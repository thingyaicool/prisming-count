name: Build Prism

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run core tests
        run: make test

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: Win64
            artifact: Prism-Windows
          - name: Android 64-bit
            runner: ubuntu-latest
            target: Android64
            artifact: Prism-Android64
          - name: Android 32-bit
            runner: ubuntu-latest
            target: Android32
            artifact: Prism-Android32
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.target }}
      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
