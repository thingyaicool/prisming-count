<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Prism Geometry Dash UI concept</title>
  <desc id="desc">Conceptual gameplay view with a compact FB Counter label, per-click frame and timing, color-banded observed gap histogram, and Prism module hub. Not a captured game screenshot.</desc>
